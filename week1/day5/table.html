<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice page for html table" />
    <title>Table Page</title>
  </head>
  <body>
    <main>
      <h1>Table</h1>

      <table>
        <caption>
          My weekly study schedule
        </caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Focus</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Monday</th>
            <td>HTML</td>
            <td>5</td>
          </tr>
          <tr>
            <th scope="row">Tuesday</th>
            <td>Git practice</td>
            <td>4</td>
          </tr>
          <tr>
            <th scope="row">Wednesday</th>
            <td>Forms</td>
            <td>5</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="2">Total</th>
            <td>14</td>
          </tr>
        </tfoot>
      </table>
    </main>
  </body>
</html>
